  - id: mysql-db-error-triage
    status: active-pilot
  - id: mysql-schema-query-copilot
    status: active-pilot
  - id: mysql-data-cleanup-copilot
    status: active-pilot
  - id: db-agent-handoff-brief
    status: active-pilot
  - id: datagrid-db-contract
