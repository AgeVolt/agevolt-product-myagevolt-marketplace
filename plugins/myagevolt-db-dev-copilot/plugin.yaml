public_git_kb:
  - README.md
  - mysql-agevolt-environment.md
  - mysql-routine-style-rules.md
  - mysql-performance-index-rules.md
  - mysql-safety-boundaries.md
  - mysql-schema-inventory.md
  - database-repo-workflow.md
  - cleanup-examples.md
  - fk-error-checklist.md
  - handoff-template.md
  - slow-query-report-template.md
  - mysql-access-gaps.md
private_sharepoint_only_kb:
  - mysql-project-instructions-triggers-cistenie.md
  - triggers-cistenie-chat-review.csv
  - triggers-cistenie-chat-index-full.csv
  - triggers-cistenie-source-manifest.csv
rules:
  database_repo_priority_over_triggers_cistenie: true
  database_repo_required_for_object_lookup: true
  branch_diff_before_commit_push: true
  private_kb_required_for_real_schema_claims: true
  public_git_contains_no_raw_db_exports: true
  no_write_mcp_in_mvp: true
  access_gap_when_database_repo_missing_schema: true
  no_pasted_show_create_or_csv_as_first_step: true
  latest_origin_main_required_before_database_branch: true
  stop_on_dirty_or_feature_branch_before_sync: true
